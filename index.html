<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121518" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="리컴프">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>리컴프 로그북</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one-hand gym logbook — sticky date header, card per exercise, bottom tab bar. Bumper-plate colors mark the three days. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --sunk:#e3e6ea; --line:#d3d8de;
  --fg:#16191d; --muted:#5d6670; --faint:#8a939c;
  --push:#d23a32; --pull:#2364c4; --legs:#c99500; --rest:#6b7681;
  --ok:#1f8a4c; --warn:#b86e00;
  --accent:var(--push);
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121518; --surface:#1b1f24; --sunk:#252a30; --line:#2f353c;
  --fg:#eceff2; --muted:#9aa3ad; --faint:#6c757e;
  --push:#f0625a; --pull:#5b93ea; --legs:#e8b52a; --rest:#8d98a3;
  --ok:#43c07a; --warn:#e6a23c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121518; --surface:#1b1f24; --sunk:#252a30; --line:#2f353c;
  --fg:#eceff2; --muted:#9aa3ad; --faint:#6c757e;
  --push:#f0625a; --pull:#5b93ea; --legs:#e8b52a; --rest:#8d98a3;
  --ok:#43c07a; --warn:#e6a23c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.5px;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:0;margin-top:6px;font-weight:500}
.weekpill{font-family:var(--mono);font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
.lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.banner{padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:13.5px;color:var(--fg);border-left:4px solid var(--warn)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--pull);outline-offset:2px}
.dayhead{display:flex;align-items:center;gap:12px}
.plate{width:46px;height:46px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:17px;flex:none;box-shadow:inset 0 0 0 5px color-mix(in srgb,#000 18%,var(--c))}
.dayhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.ex-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-name{font-weight:700;font-size:15.5px;min-width:0}
.target{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.last{font-size:12.5px;color:var(--muted);margin-top:2px}
.up{display:inline-block;font-size:11.5px;font-weight:700;color:var(--ok);margin-left:6px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px 8px;align-items:center;margin-top:10px}
.sets .h{font-size:11px;color:var(--faint);font-weight:700;letter-spacing:.06em}
.sn{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;font:600 16px var(--mono);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);text-align:right}
.sets input::placeholder{color:var(--faint);font-weight:500}
.ck{width:44px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--faint);font-size:18px}
.ck[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.row .t{font-weight:700}
.row .s{font-size:12.5px;color:var(--muted)}
.btn{font:700 16px var(--body);padding:14px;border-radius:12px;border:0;background:var(--c,var(--fg));color:#fff;cursor:pointer;width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btn.ghost{background:var(--sunk);color:var(--fg)}
.toggle{width:54px;height:32px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--ok)}
.toggle[aria-pressed="true"]::after{left:25px}
.field{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.field .in{display:flex;align-items:baseline;gap:8px}
.field input{flex:1;min-width:0;font:600 26px var(--mono);border:0;background:transparent;color:var(--fg);padding:0}
.field input::placeholder{color:var(--faint)}
.unit{color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid2 input{width:100%}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar b{display:block;height:100%;background:var(--ok);border-radius:999px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{font:600 13px var(--mono);padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);cursor:pointer}
.dopt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit}
.dopt b{font-size:14.5px}
.dopt span{grid-column:1;font-size:12.5px;color:var(--muted)}
.dopt .g{grid-column:2;grid-row:1 / span 2;font:600 16px var(--mono);color:var(--ok)}
.dlist{display:flex;flex-direction:column;gap:6px}
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal .card{background:var(--surface);color:var(--fg);border-radius:16px;padding:22px 20px 16px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .card h2{font-size:22px}
.modal .card p{margin:0;color:var(--muted);font-size:14px}
.motto{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.motto q{font-family:var(--display);font-size:19px;line-height:1.4;quotes:none;text-wrap:balance}
.motto small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.restbar{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.restbar .in{pointer-events:auto;width:100%;max-width:536px;background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.restbar .tm{font:600 26px var(--mono);font-variant-numeric:tabular-nums;min-width:74px}
.restbar .lb{font-size:12.5px;line-height:1.35;min-width:0;overflow:hidden}
.restbar .lb b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.restbar button{font:700 13px var(--body);border:0;border-radius:8px;padding:9px 10px;background:color-mix(in srgb,var(--bg) 18%,transparent);color:var(--bg);cursor:pointer}
.restbar .pg{grid-column:1 / -1;height:4px;border-radius:99px;background:color-mix(in srgb,var(--bg) 20%,transparent);overflow:hidden}
.restbar .pg i{display:block;height:100%;background:var(--ok);width:0}
.restbar.done .in{background:var(--ok);color:#fff}
.restbar.done button{color:#fff}
body.resting .wrap{padding-bottom:200px}
.rt-list{display:flex;flex-direction:column;gap:2px}
.rt-item{display:grid;grid-template-columns:52px minmax(0,1fr) 30px;gap:8px;align-items:center;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);font:inherit;text-align:left;cursor:pointer;width:100%}
.rt-item:last-child{border-bottom:0}
.rt-item .tm{font:600 13px var(--mono);color:var(--muted)}
.rt-item .bx{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;font-size:15px}
.rt-item[aria-pressed="true"] .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.rt-item[aria-pressed="true"] .nm{color:var(--muted);text-decoration:line-through}
.cele{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:color-mix(in srgb,#000 50%,transparent);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.cele canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cele .card{position:relative;background:var(--surface);color:var(--fg);border-radius:18px;padding:24px 20px 16px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;text-align:center}
.cele .big{font-family:var(--display);font-size:30px;line-height:1.2}
.cele p{margin:0;color:var(--muted);font-size:14px}
.rw{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.rw .d{font:600 13px var(--mono);text-align:center;border-radius:8px;padding:6px 0;background:var(--sunk);color:var(--muted)}
.rw.got .d{background:var(--ok);color:#fff}
.rw .t{min-width:0}
.rw .t b{display:block;font-size:14.5px;overflow-wrap:anywhere}
.rw .t span{font-size:12px;color:var(--muted)}
.rw input{width:100%;font:600 14px var(--body);border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);padding:6px 8px}
.rw button{font:600 12px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 9px;cursor:pointer}
.verdict{border-radius:12px;padding:12px;background:var(--surface);border:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.verdict .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none;background:var(--vc)}
.verdict p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px 6px;overflow-x:auto}
.chartbox svg{display:block;width:100%;height:auto}
.empty{color:var(--muted);font-size:13.5px;padding:24px 8px;text-align:center}
.weeks{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.wk{aspect-ratio:1;border-radius:4px;background:var(--sunk);position:relative;max-width:100%}
.wk.ok{background:var(--ok)} .wk.part{background:color-mix(in srgb,var(--ok) 40%,var(--sunk))}
.wk.dl{outline:1.5px dashed var(--warn);outline-offset:-1.5px}
.wk.now{box-shadow:0 0 0 2px var(--fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 10px;overflow-x:auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs div{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font:700 13px var(--body);padding:12px 4px 14px;cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-top-color:var(--fg)}
.note{font-size:12px;color:var(--faint);text-align:center;margin-top:20px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<style>html,body{margin:0}body{min-height:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">리컴프 로그북<small id="dateline">불러오는 중</small></div>
    <span class="weekpill" id="weekpill">W1 / 26</span>
  </header>
  <main id="view"></main>
  <p class="note" id="savenote">이 폰에만 저장돼요</p>
</div>
<nav class="tabs" aria-label="화면"><div role="tablist">
  <button role="tab" id="tab-today" data-tab="today" aria-selected="true">오늘 운동</button>
  <button role="tab" id="tab-body" data-tab="body" aria-selected="false">몸 기록</button>
  <button role="tab" id="tab-progress" data-tab="progress" aria-selected="false">변화</button>
</div></nav>

<script>
(() => {
// ---------- plan ----------
const BASE = {date:"2026-11-05", weight:88, bf:23, smm:38};
const GOAL = {weight:"81~84", bf:"14~17", smm:"40.5~41"};
const PRIOR = {label:"9/19 (운동하던 때)", weight:85.8, bf:19.6, smm:39.7};
const START = "2026-11-09";
const PROTEIN = 160;
const ROT = ["push","pull","legs"];
const TYPES = {
  push:{name:"밀기", sub:"가슴 · 어깨 · 삼두", c:"var(--push)", ex:[
    ["덤벨 인클라인 벤치",4,"8~10"],["스미스 벤치프레스",3,"8~10"],["숄더 프레스 머신",3,"8~10"],
    ["펙덱 플라이",3,"12~15"],["덤벨 사이드 레터럴 레이즈",4,"12~15"],["케이블 푸쉬다운",3,"12~15"]]},
  pull:{name:"당기기", sub:"등 · 후면 어깨 · 이두", c:"var(--pull)", ex:[
    ["어시스트 풀업",3,"8~10","맨몸으로 되면 보조 없이"],["랫풀다운 (와이드 그립)",3,"10~12"],["시티드 케이블 로우 (좁은 그립)",3,"10~12"],
    ["리버스 펙덱 플라이",3,"12~15"],["케이블 사이드 레터럴 레이즈",3,"12~15"],["덤벨 컬",3,"10~12"]]},
  legs:{name:"하체", sub:"하체 · 복근", c:"var(--legs)", ex:[
    ["레그프레스",4,"10~12"],["핵스쿼트 머신",3,"8~10","없으면 스미스 스쿼트"],["시티드 레그컬",3,"10~12","없으면 라잉 레그컬"],
    ["레그 익스텐션",3,"12~15"],["힙 쓰러스트 머신",3,"10~12","없으면 스미스 힙 쓰러스트"],["앱도미널 크런치 머신",3,"12~15","없으면 케이블 크런치"]]},
  rest:{name:"휴식", sub:"완전 휴식 · 걷기만", c:"var(--rest)", ex:[]}
};
const PHASES = [
  {w:[1,8], name:"1단계 · 습관과 자세", tip:"세트마다 2~3개 여유를 남기세요. 처음 2주는 예전 무게의 60~70%."},
  {w:[9,16], name:"2단계 · 근성장 본격화", tip:"무게를 올리고 마지막 세트는 1~2개 여유까지."},
  {w:[17,26], name:"3단계 · 정체 돌파와 마무리", tip:"체지방 마무리. 필요하면 칼로리를 조금 더 조정해요."}
];
const DELOAD = [8,16,24];

// ---------- dates ----------
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const TODAY = ymd(new Date());
const weekNo = s => Math.max(1, Math.floor(diffDays(START,s)/7)+1);
const weekStart = s => { const d = parse(s); const wd = (d.getDay()+6)%7; d.setDate(d.getDate()-wd); return ymd(d); };
const DOW = ["일","월","화","수","목","금","토"];

// ---------- store ----------
const S = { days:{}, state:{next:0}, tab:"today", mode:"local" };
let dbApi=null, dayCol=null, stateRef=null;
const dirty = new Set();
const timers = {}; const chains = {};
const LSK = "recomp-logbook-v1";

function day(d=TODAY){ return S.days[d] || (S.days[d] = {date:d}); }
function lsSave(){ try{ localStorage.setItem(LSK, JSON.stringify({days:S.days,state:S.state,lastBackup:S.lastBackup||null})); }catch(e){ note("저장 실패 · 폰 저장 공간을 확인해주세요"); } }
function lsLoad(){ try{ const v = JSON.parse(localStorage.getItem(LSK)||"null"); if(v){ S.days=v.days||{}; S.state=v.state||{next:0}; S.lastBackup=v.lastBackup||null; } }catch(e){} }

function note(t){ document.getElementById("savenote").textContent = t; }
function save(d){
  dirty.add(d);
  clearTimeout(timers[d]);
  timers[d] = setTimeout(() => flush(d), 600);
  lsSave();
}
function flush(d){
  if(!dayCol){ dirty.delete(d); lsSave(); backupNote(); return; }
  const body = JSON.parse(JSON.stringify(S.days[d]));
  chains[d] = (chains[d]||Promise.resolve()).then(() => dayCol.doc(d).set(body))

function typeFor(d){
  const rec = S.days[d];
  if(rec && rec.type) return rec.type;
  if(parse(d).getDay()===0) return "rest";
  return ROT[S.state.next||0];
}
function lastSession(type, exName, before){
  const keys = Object.keys(S.days).filter(k => k<before).sort().reverse();
  for(const k of keys){
    const r = S.days[k];
    if(r.type===type && r.ex && r.ex[exName] && r.ex[exName].some(s=>s && s.w!=null && s.r!=null)) return {date:k, sets:r.ex[exName]};
  }
  return null;
}
function topRep(range){ return Number(String(range).split("~").pop()); }
function phaseOf(w){ return PHASES.find(p => w>=p.w[0] && w<=p.w[1]) || PHASES[2]; }
function fmt(n,dg=1){ return (n==null||isNaN(n)) ? "–" : Number(n).toFixed(dg).replace(/\.0$/,""); }
function weekAvg(ws){
  const v=[]; for(let i=0;i<7;i++){ const r=S.days[addDays(ws,i)]; if(r && r.weight) v.push(r.weight); }
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
function workoutsInWeek(ws){
  let n=0; for(let i=0;i<7;i++){ const r=S.days[addDays(ws,i)]; if(r && r.done && r.type!=="rest") n++; } return n;
}

  const sub = `D+${n+1} · 26주 중 ${Math.min(26,weekNo(TODAY))}주 차`;
  const rec = S.days[TODAY] || {};
  if(rec.done && rec.type!=="rest") return {q:"오늘 운동 끝. 이 기록 하나하나가 6개월을 만들어요.", sub};

function lastWeight(){ const k=Object.keys(S.days).filter(k=>S.days[k].weight).sort().pop(); return k?S.days[k].weight:null; }
function paintVerdict(){
  const box = document.getElementById("verdict"); if(!box) return;
  const ws = weekStart(TODAY);
  const a = weekAvg(ws), b = weekAvg(addDays(ws,-7)), c = weekAvg(addDays(ws,-14));
  let vc="var(--faint)", t="데이터 모으는 중", s="매일 아침 공복 체중을 적으면, 지난주와 비교해서 칼로리 조정이 필요한지 알려드려요.";
  if(a!=null && b!=null && TODAY < addDays(START,14)){
    const dlt = a-b;
    vc="var(--faint)"; t=`이번 주 ${dlt>0?"+":""}${fmt(dlt)}kg · 적응 기간`; s="첫 2주는 술과 짠 음식을 줄이면서 수분이 빠져 빠르게 줄 수 있어요. 칼로리 조정은 3주 차부터 판단해요.";
  } else if(a!=null && b!=null){
    const dlt = a-b;
    if(dlt<=-1){ vc="var(--warn)"; t=`주 ${fmt(-dlt)}kg 감소 · 너무 빨라요`; s="근육이 같이 빠질 수 있어요. 하루 150kcal 늘리세요."; }
    else if(dlt<=-0.3){ vc="var(--ok)"; t=`주 ${fmt(-dlt)}kg 감소 · 잘 가고 있어요`; s="지금 식단과 운동 그대로 유지하세요."; }
    else {
      const stalled2 = c!=null && (b-c)>-0.3;
      if(stalled2){ vc="var(--warn)"; t="2주 연속 거의 그대로"; s="하루 150~200kcal 덜 먹거나, 소모 칼로리를 하루 200kcal 정도 늘리세요."; }
      else { vc="var(--faint)"; t=`이번 주 ${dlt>0?"+":""}${fmt(dlt)}kg`; s="한 주는 변동일 수 있어요. 다음 주까지 지켜봐요."; }
    }
  }
  const bv=[]; for(let i=0;i<7;i++){ const r=S.days[addDays(ws,i)]; if(r&&r.burn) bv.push(r.burn); }
  const avgTxt = `이번 주 평균 ${a!=null?fmt(a)+"kg":"–"} · 지난주 ${b!=null?fmt(b)+"kg":"–"}${bv.length?` · 평균 소모 ${Math.round(bv.reduce((x,y)=>x+y,0)/bv.length).toLocaleString()}kcal`:""}`;
  box.replaceChildren(el(`<div class="verdict" style="--vc:${vc}"><span class="dot"></span><div><b>${t}</b><p>${s}</p><p class="num" style="font-size:12.5px">${avgTxt}</p></div></div>`));
}

function chart(pts){
  const box = el(`<div class="chartbox"></div>`);
  if(pts.length<2){ box.append(el(`<div class="empty">시작 체중 88kg에서 출발해요.<br>몸 기록 탭에 아침 체중을 적으면 여기에 선이 그려져요.</div>`)); }
  const W=380,H=220,L=30,R=8,T=12,B=26;
  const d0 = pts[0].d, d1 = pts.length>1 ? pts[pts.length-1].d : addDays(d0,14);
  const span = Math.max(14, diffDays(d0,d1));
  const ws = pts.map(p=>p.w);
  let lo = Math.floor(Math.min(...ws, 84)-0.5), hi = Math.ceil(Math.max(...ws)+0.5);
  const x = d => L + diffDays(d0,d)/span*(W-L-R);
  const y = w => T + (hi-w)/(hi-lo)*(H-T-B);
  let g = "";
  const step = (hi-lo)>8?2:1;
  for(let v=lo; v<=hi; v+=step){ g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`; }
  // goal band 81–84
  const gb1=Math.max(lo,81), gb2=Math.min(hi,84);
  if(gb2>gb1) g += `<rect x="${L}" y="${y(gb2)}" width="${W-L-R}" height="${y(gb1)-y(gb2)}" fill="var(--ok)" opacity=".10"/><text x="${W-R-4}" y="${y(gb2)+13}" text-anchor="end" font-size="11" fill="var(--ok)">목표 81~84kg</text>`;
  // x labels
  const ticks = 4;
  for(let i=0;i<=ticks;i++){ const dd=addDays(d0,Math.round(span*i/ticks)); const p=parse(dd); g+=`<text x="${x(dd)}" y="${H-8}" text-anchor="${i===0?"start":i===ticks?"end":"middle"}" font-size="11" fill="var(--muted)">${p.getMonth()+1}/${p.getDate()}</text>`; }
  if(pts.length>=2){
    // 7-day rolling avg
    const avg = pts.map((p,i)=>{ const win=pts.filter(q=>diffDays(q.d,p.d)>=0 && diffDays(q.d,p.d)<7); return {d:p.d,w:win.reduce((a,b)=>a+b.w,0)/win.length}; });
    g += pts.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.w)}" r="2.6" fill="var(--faint)"/>`).join("");
    g += `<polyline points="${avg.map(p=>`${x(p.d)},${y(p.w)}`).join(" ")}" fill="none" stroke="var(--fg)" stroke-width="2.4" stroke-linejoin="round"/>`;
    const e = avg[avg.length-1];
    g += `<circle cx="${x(e.d)}" cy="${y(e.w)}" r="5" fill="var(--fg)"/><text x="${Math.min(x(e.d),W-R-60)}" y="${y(e.w)-10}" font-size="12.5" font-weight="600" fill="var(--fg)" font-family="IBM Plex Mono,monospace">${fmt(e.w)}kg</text>`;
  } else {
    g += `<circle cx="${x(d0)}" cy="${y(pts[0].w)}" r="5" fill="var(--fg)"/><text x="${x(d0)+8}" y="${y(pts[0].w)-8}" font-size="12.5" font-weight="600" fill="var(--fg)" font-family="IBM Plex Mono,monospace">88kg 시작</text>`;
  }
  box.prepend(el(`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="체중 추이와 7일 평균">${g}</svg>`));
  if(pts.length>=2) box.append(el(`<div class="legend" style="padding:4px 6px"><span><i style="background:var(--faint);border-radius:50%"></i>매일 체중</span><span><i style="background:var(--fg);height:3px"></i>7일 평균</span></div>`));
  return box;
}

async function exportData(){
  const payload = JSON.stringify({app:"recomp-logbook", version:1, exportedAt:new Date().toISOString(), days:S.days, state:S.state}, null, 1);
  const name = `recomp-backup-${TODAY}.json`;
  const file = new File([payload], name, {type:"application/json"});
  let ok = false;
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"리컴프 로그북 백업"}); ok = true; }
  }catch(e){ if(e && e.name==="AbortError") return; }

    document.body.append(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }

writeStatus();
  if(S.tab==="progress") render();
}

function importData(file, msgEl){

      msgEl.replaceChildren(el(`<div class="verdict" style="--vc:var(--warn)"><span class="dot"></span><div><b>${n}일치 기록을 불러올까요?</b><p>지금 이 폰에 있는 기록은 백업 파일 내용으로 바뀌어요.</p><div class="quick" style="margin-top:8px"><button id="imp-yes">불러오기</button><button id="imp-no">취소</button></div></div></div>`));

  };

}

    <span class="unit" style="font-size:12px">백업 파일은 카카오톡 나에게 보내기, 구글 드라이브, 파일 앱 등에 저장해두세요.</span><div id="bk-msg"></div></div>`);

// ---------- 10pm reminder ----------
const VAPID_PUBLIC = "BLVGyjcStFEaJhKdxQoI0StMtljtBy33G6RDBsw53F-YvrUa46wFRJ0dxnOQ267mvw5r_MoAFpvPAPAZMokWTUs";
function b64u(s){ const p="=".repeat((4-s.length%4)%4); const r=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(r,c=>c.charCodeAt(0)); }
async function renderNotify(sec){
  sec.append(el(`<h2 style="margin-top:8px">밤 기록 알림</h2>`));
  const box = el(`<div class="field"><span class="lbl">알림</span><div id="nt-body" style="display:flex;flex-direction:column;gap:8px"></div></div>`);
  sec.append(box);
  const body = box.querySelector("#nt-body");
  const say = h => body.replaceChildren(...[...el(`<div>${h}</div>`).childNodes]);
  if(!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)){
    say(`<span class="unit">이 브라우저는 알림을 지원하지 않아요. 홈 화면에 설치한 앱에서 열어주세요.</span>`); return; }
  if(Notification.permission==="denied"){
    say(`<span class="unit">알림이 차단돼 있어요. 폰 설정 → 애플리케이션 → 리컴프(또는 Chrome) → 알림에서 허용해주세요.</span>`); return; }
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  const showSub = (sub) => {
    const code = JSON.stringify(sub);
    say(`<span class="unit" style="font-size:13px">알림이 켜졌어요. 아래 코드를 복사해서 GitHub 저장소의 PUSH_SUBSCRIPTION 시크릿에 넣으면 매일 밤 기록 알림이 시작돼요.</span>
      <textarea id="nt-code" readonly rows="3" style="width:100%;font:12px var(--mono);border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--fg);padding:8px;resize:none"></textarea>
      <div class="quick"><button id="nt-copy">코드 복사</button><button id="nt-test">알림 테스트</button></div><span class="unit" id="nt-msg" style="font-size:12px"></span>`);
    const ta = body.querySelector("#nt-code"); ta.value = code;
    body.querySelector("#nt-copy").onclick = async () => { try{ await navigator.clipboard.writeText(code); body.querySelector("#nt-msg").textContent="복사했어요."; }catch(e){ ta.select(); body.querySelector("#nt-msg").textContent="길게 눌러 복사해주세요."; } };
    body.querySelector("#nt-test").onclick = () => reg.showNotification("오늘 기록하셨나요?", {body:"알림 테스트예요. 밤 10시에는 이렇게 와요.", icon:"icon-192.png", badge:"icon-192.png", tag:"test"});
  };
  if(sub && Notification.permission==="granted"){ showSub(sub); return; }
  say(`<span class="unit" style="font-size:13px">매일 밤 10시에 "오늘 기록하셨나요?" 알림을 받아요. 그날 '몸 상태 등록 완료'를 눌렀으면 조용한 확인 알림만 와요.</span><button class="btn" id="nt-on" style="--c:var(--pull)">알림 켜기</button>`);
  body.querySelector("#nt-on").onclick = async () => {
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ renderNotify_retry(sec); return; }
    try{ sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID_PUBLIC)}); showSub(sub); }
    catch(e){ say(`<span class="unit">알림 등록에 실패했어요. 앱을 껐다 켠 뒤 다시 눌러주세요.</span>`); }
  };
}
function renderNotify_retry(){ render(); }

// ---------- rest timer ----------
const REST = {복합:150, 중간:105, 고립:75};
const CAT = {"덤벨 인클라인 벤치":"복합","스미스 벤치프레스":"복합","숄더 프레스 머신":"복합","펙덱 플라이":"고립","덤벨 사이드 레터럴 레이즈":"고립","케이블 푸쉬다운":"고립",
  "랫풀다운 (와이드 그립)":"복합","어시스트 풀업":"복합","T바 로우":"복합","시티드 케이블 로우 (좁은 그립)":"중간","덤벨 슈러그":"고립","리버스 펙덱 플라이":"고립","케이블 사이드 레터럴 레이즈":"고립","덤벨 컬":"고립",
  "레그프레스":"복합","핵스쿼트 머신":"복합","시티드 레그컬":"중간","레그 익스텐션":"고립","힙 쓰러스트 머신":"중간","앱도미널 크런치 머신":"고립"};
const RT = {end:0,total:0,iv:null,lock:null,ac:null};
const rbar = el(`<div class="restbar" id="restbar" hidden><div class="in" role="timer" aria-live="off">
  <span class="tm" id="rt-t">0:00</span><span class="lb"><b id="rt-l"></b><span id="rt-s"></span></span>
  <button id="rt-plus" aria-label="휴식 30초 추가">+30초</button><button id="rt-skip">건너뛰기</button>
  <div class="pg"><i id="rt-p"></i></div></div></div>`);
document.body.append(rbar);
const mmss = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function beep(){
  try{ const ac = RT.ac; if(!ac) return; const t0 = ac.currentTime;
    [0,0.28,0.56].forEach((d,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value = i===2?1175:880; o.type="sine";
      g.gain.setValueAtTime(0.0001,t0+d); g.gain.exponentialRampToValueAtTime(0.35,t0+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.22);
      o.connect(g).connect(ac.destination); o.start(t0+d); o.stop(t0+d+0.25); });
  }catch(e){}
}
function stopRest(){
  clearInterval(RT.iv); RT.iv=null; RT.end=0; rbar.hidden=true; rbar.classList.remove("done"); document.body.classList.remove("resting");
  try{ RT.lock && RT.lock.release(); }catch(e){} RT.lock=null;
}
function tickRest(){
  const left = Math.max(0, Math.round((RT.end-Date.now())/1000));
  rbar.querySelector("#rt-t").textContent = mmss(left);
  rbar.querySelector("#rt-p").style.width = (100 - left/RT.total*100) + "%";
  if(left<=0 && !rbar.classList.contains("done")){
    rbar.classList.add("done"); rbar.querySelector("#rt-t").textContent = "GO";
    rbar.querySelector("#rt-s").textContent = "휴식 끝 · 다음 세트 시작해요";
    try{ navigator.vibrate && navigator.vibrate([300,120,300,120,500]); }catch(e){}
    beep(); clearInterval(RT.iv); RT.iv=null;
    setTimeout(()=>{ if(rbar.classList.contains("done")) stopRest(); }, 6000);
  }
}
function startRest(name, setIdx, sets){
  const cat = CAT[name] || "고립", sec = REST[cat];
  try{ RT.ac = RT.ac || new (window.AudioContext||window.webkitAudioContext)(); RT.ac.resume && RT.ac.resume(); }catch(e){}
  RT.total = sec; RT.end = Date.now()+sec*1000;
  rbar.classList.remove("done"); rbar.hidden=false; document.body.classList.add("resting");
  rbar.querySelector("#rt-l").textContent = setIdx+1 < sets ? `${name} · ${setIdx+2}세트 준비` : `${name} 끝 · 다음 운동으로`;
  rbar.querySelector("#rt-s").textContent = `${cat} 운동 휴식 ${mmss(sec)}`;
  clearInterval(RT.iv); RT.iv = setInterval(tickRest, 250); tickRest();
  try{ if(navigator.wakeLock && !RT.lock) navigator.wakeLock.request("screen").then(l=>RT.lock=l).catch(()=>{}); }catch(e){}
}
rbar.querySelector("#rt-plus").onclick = () => { if(rbar.classList.contains("done")){ rbar.classList.remove("done"); RT.end=Date.now(); RT.total=30; } RT.end += 30000; RT.total += 30; if(!RT.iv) RT.iv=setInterval(tickRest,250); tickRest(); };
rbar.querySelector("#rt-skip").onclick = stopRest;
document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && RT.end) tickRest(); });

// ---------- rewards ----------
const CHICKEN_EVERY = 20;
function rewards(){ S.state.chickens = S.state.chickens || []; S.state.chickenShown = S.state.chickenShown || 0; return S.state; }
function controlledDays(){ return Object.keys(S.days).filter(k=>routineOk(k)).length; }
function chickenStatus(){ const R=rewards(); const tot=controlledDays(); const earned=Math.floor(tot/CHICKEN_EVERY); return {tot, earned, avail: Math.max(0, earned-R.chickens.length), prog: tot % CHICKEN_EVERY}; }
function points(){
  let p=0, perfect=0;
  for(const k of Object.keys(S.days)){
    const r=S.days[k]; const {n,total}=routineScore(k); p += n*10;
    if(total && n===total){ p+=30; perfect++; }
    if(r.done && r.type!=="rest") p+=20;
  }
  return {p, perfect};
}
function confetti(cv){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx=cv.getContext("2d"); const W=cv.width=cv.offsetWidth*devicePixelRatio, H=cv.height=cv.offsetHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement); const cols=["--push","--pull","--legs","--ok"].map(v=>cs.getPropertyValue(v).trim()||"#888");
  const ps=[...Array(120)].map(()=>({x:W/2,y:H*0.45,vx:(Math.random()-0.5)*W*0.03,vy:-Math.random()*H*0.03-H*0.005,r:(4+Math.random()*5)*devicePixelRatio,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
  let f=0; (function step(){ ctx.clearRect(0,0,W,H); ps.forEach(p=>{ p.vy+=H*0.0009; p.x+=p.vx; p.y+=p.vy; p.a+=0.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); if(++f<150) requestAnimationFrame(step); else ctx.clearRect(0,0,W,H); })();
}
function celebrate(big, text, sub){
  if(document.querySelector(".cele")) return;
  const m = el(`<div class="cele" role="dialog" aria-modal="true"><canvas></canvas><div class="card"><div class="plate" style="--c:var(--ok);width:52px;height:52px;margin:0 auto;font-size:18px">★</div><div class="big"></div><p class="tx"></p><p class="sb" style="font-size:12.5px"></p><button class="btn" style="--c:var(--ok);margin-top:6px">좋아요</button></div></div>`);
  m.querySelector(".big").textContent=big; m.querySelector(".tx").textContent=text; m.querySelector(".sb").textContent=sub||"";
  m.querySelector("button").onclick=()=>m.remove(); document.body.append(m); confetti(m.querySelector("canvas"));
  try{ navigator.vibrate && navigator.vibrate([80,60,80]); }catch(e){}
}
function checkRewards(){
  const R=rewards(), c=chickenStatus();
  if(c.earned > R.chickenShown){ R.chickenShown=c.earned; saveState();
    celebrate("치킨 획득", `통제한 날 ${c.tot}일. 치킨 한 마리 먹을 자격이 생겼어요.`, "이번 주 자유 한 끼로 먹고, 술은 빼고, 다음 날은 원래 식단으로."); return true; }
  return false;
}
function renderRewards(sec){
  const R=rewards(), c=chickenStatus(), st=routineStreak(), {p}=points();
  sec.append(el(`<h2>보상 · 치킨</h2>`));
  const card = el(`<div class="field"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><span class="lbl" style="text-transform:none">다음 치킨까지</span><span class="num" style="font-size:13px;color:var(--muted)">${c.prog} / ${CHICKEN_EVERY}일</span></div>
    <div class="bar" style="height:14px"><b style="width:${c.prog/CHICKEN_EVERY*100}%;background:var(--legs)"></b></div>
    <span class="unit" style="font-size:12.5px">통제한 날(루틴 70% 이상)이 ${CHICKEN_EVERY}일 쌓일 때마다 치킨 한 마리. 연속이 아니어도 돼요. 꾸준히 하면 한 달에 한 번쯤이에요.</span>
    <div id="ck-avail"></div></div>`);
  const av = card.querySelector("#ck-avail");
  if(c.avail>0){
    const b = el(`<div class="verdict" style="--vc:var(--legs);margin-top:6px"><span class="dot"></span><div><b>먹을 수 있는 치킨 ${c.avail}마리</b><p>그 주 자유 한 끼로 · 술 빼고 · 다음 날은 원래 식단</p><div class="quick" style="margin-top:8px"><button id="ck-eat">치킨 먹었어요</button></div></div></div>`);
    b.querySelector("#ck-eat").onclick = () => { R.chickens.push(TODAY); saveState(); render(); };
    av.append(b);
  }
  sec.append(card);
  sec.append(el(`<div class="grid2"><div class="field"><span class="lbl" style="text-transform:none">통제한 날</span><span class="num" style="font-size:24px;font-weight:600">${c.tot}<span class="unit"> 일</span></span></div><div class="field"><span class="lbl" style="text-transform:none">루틴 연속 · 포인트</span><span class="num" style="font-size:24px;font-weight:600">${st}<span class="unit"> 일 · ${p.toLocaleString()}P</span></span></div></div>`));
  if(R.chickens.length) sec.append(el(`<p style="margin:0;font-size:12.5px;color:var(--muted)">먹은 치킨: ${R.chickens.map(d=>{const x=parse(d);return `${x.getMonth()+1}/${x.getDate()}`}).join(", ")}</p>`));
}

// ---------- render ----------
let pendingRender=false;
function render(){
  const v = document.getElementById("view");
  const y = window.scrollY;
  v.replaceChildren();
  header();
  if(S.tab==="today") renderToday(v);
  else if(S.tab==="body") renderBody(v);
  else renderProgress(v);
  window.scrollTo(0,y);
}
function softRender(){
  const a = document.activeElement;
  if(a && a.tagName==="INPUT"){ pendingRender=true; return; }
  render();
}
document.addEventListener("focusout", () => { if(pendingRender){ pendingRender=false; setTimeout(()=>{ if(!(document.activeElement&&document.activeElement.tagName==="INPUT")) render(); },50);} });
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => {
  S.tab = b.dataset.tab;
  document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected", x===b));

});
try{ const h=location.hash.slice(1); if(["today","body","progress"].includes(h)){ localStorage.setItem(LSK+"-tab",h); history.replaceState(null,"",location.pathname); } }catch(e){}
try{ const t=localStorage.getItem(LSK+"-tab"); if(t){ S.tab=t; document.querySelectorAll("nav.tabs button").forEach(x=>x.setAttribute("aria-selected", x.dataset.tab===t)); } }catch(e){}
